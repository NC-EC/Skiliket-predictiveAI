[project]
name = "coldstart"
version = "0.1.0"
description = "Cold-start forecasting of indoor air quality with small local models (SKILIKET-style sensor channels)"
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "scikit-learn", "pyyaml", "openpyxl"]

[project.optional-dependencies]
dev = ["pytest"]
models = ["lightgbm", "torch", "scipy"]
figures = ["matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
